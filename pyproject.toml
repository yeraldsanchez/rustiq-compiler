[project]
name = "rustiq-compiler"
version = "0.1.0"
description = "Compilador de un subconjunto de Rust a WebAssembly"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "antlr4-python3-runtime==4.13.2",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "wasmtime>=50.0.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "antlr4-tools==0.2.2",
    "pytest>=9.2.0",
]
