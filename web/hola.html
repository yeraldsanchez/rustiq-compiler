<!doctype html>
<meta charset="utf-8">
<title>hola.wasm</title>
<h1>Prueba de humo: hola.wasm</h1>
<pre id="salida"></pre>
<script>
  // Compilar antes: wat2wasm tests/wat/hola.wat -o web/hola.wasm
  const salida = document.getElementById("salida");
  const env = { print_i32: (n) => { salida.textContent += n + "\n"; } };

  WebAssembly.instantiateStreaming(fetch("hola.wasm"), { env })
    .then(({ instance }) => instance.exports.main())
    .catch((e) => { salida.textContent = "Error: " + e; });
</script>
